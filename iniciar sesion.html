<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Villa 360 - Iniciar Sesión</title>
    <link rel="stylesheet" href="p10.css"> 
</head>
<body>
    <!-- Encabezado -->
    <header>
        <img src="img/logo.png" alt="Logo Villa 360" width="150">
        <h1>Villa 360</h1>
    </header>

    <!-- Contenido principal -->
    <main>
        <section>
            <h2>Iniciar Sesión</h2>
            <form action="#" method="post">
                <label for="usuario">Usuario:</label>
                <input type="text" id="usuario" name="usuario" required>

                <label for="contrasena">Contraseña:</label>
                <input type="password" id="contrasena" name="contrasena" required>

                <button type="submit">Iniciar Sesión</button>
            </form>
            <p>¿No tienes cuenta? <a href="registrar.html">Regístrate aquí</a></p>
        </section>
    </main>

    <!-- Pie de página -->
    <footer>
        <p>© 2026 Villa 360. Todos los derechos reservados.</p>
    </footer>
</body>
</html>
